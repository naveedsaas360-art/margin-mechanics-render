name: images
# Generate AI illustrations with FLUX.1-schnell (Apache-2.0) on free CPU runners via stable-diffusion.cpp.
# Input: <episode>/ai_jobs.json = [{"file": "<key>.png", "prompt": "...", "seed": N}, ...] (written by tools/gen_images.py)
on:
  workflow_dispatch:
    inputs:
      episode: {description: "Episode folder", required: true}

env:
  SDCPP_TAG: master-1050-58bb3c1

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.p.outputs.idx }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "idx=$(python3 -c "import json;print(json.dumps(list(range(len(json.load(open('${{ inputs.episode }}/ai_jobs.json')))))))")" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache@v4
        with: {path: sdbin, key: "sdcpp-${{ env.SDCPP_TAG }}-avx2"}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --recursive --depth 1 -b "$SDCPP_TAG" https://github.com/leejet/stable-diffusion.cpp sdsrc
          cmake -S sdsrc -B sdsrc/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DSD_BUILD_SHARED_LIBS=OFF
          cmake --build sdsrc/build --config Release -j "$(nproc)"
          mkdir -p sdbin
          BIN="$(find sdsrc/build/bin -maxdepth 1 -type f -executable \( -name sd -o -name sd-cli \) | head -1)"
          cp "$BIN" sdbin/sd
      - uses: actions/upload-artifact@v4
        with: {name: sdbin, path: sdbin, retention-days: 1}

  gen:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: sdbin, path: sdbin}
      - name: swap + models
        run: |
          free -g; nproc; df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost &
          wait; df -h /
          sudo fallocate -l 8G /swap8 && sudo chmod 600 /swap8 && sudo mkswap /swap8 >/dev/null && sudo swapon /swap8 || true
          free -g; df -h /
          mkdir -p m && cd m
          HF=https://huggingface.co
          curl -sfL -o flux.gguf "$HF/city96/FLUX.1-schnell-gguf/resolve/main/flux1-schnell-Q4_K_S.gguf" &
          curl -sfL -o t5.gguf   "$HF/city96/t5-v1_1-xxl-encoder-gguf/resolve/main/t5-v1_1-xxl-encoder-Q4_K_M.gguf" &
          curl -sfL -o clip_l.safetensors "$HF/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors" &
          curl -sfL -o ae.safetensors "$HF/Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/main/split_files/vae/ae.safetensors" &
          wait; ls -la
      - name: generate
        run: |
          chmod +x sdbin/sd; mkdir -p out
          python3 - <<'EOF'
          import json, subprocess, time
          job = json.load(open("${{ inputs.episode }}/ai_jobs.json"))[${{ matrix.i }}]
          t = time.time()
          subprocess.run(["sdbin/sd", "--diffusion-model", "m/flux.gguf", "--vae", "m/ae.safetensors",
                          "--clip_l", "m/clip_l.safetensors", "--t5xxl", "m/t5.gguf",
                          "-p", job["prompt"], "--cfg-scale", "1.0", "--sampling-method", "euler", "--steps", "4",
                          "-W", str(job.get("w", 1280)), "-H", str(job.get("h", 720)), "--seed", str(job["seed"]),
                          "--vae-tiling", "-t", str(__import__("os").cpu_count()), "-o", "out/" + job["file"]], check=True)
          print("seconds:", round(time.time() - t))
          EOF
        env: {}
      - if: always()
        run: ls -la out || true
      - uses: actions/upload-artifact@v4
        with: {name: "img-${{ matrix.i }}", path: out, retention-days: 3}
